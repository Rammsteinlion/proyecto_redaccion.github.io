<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Linderos Pro</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .paper-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .preview-content {
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.6;
    }

    #redaccionTecnica:empty::before {
      content: "La redacción aparecerá aquí después de procesar el Excel...";
      color: #9ca3af;
      font-style: italic;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center">
          <i class="fas fa-map-marked-alt mr-3 text-blue-600"></i> Generador de Redacción Técnica
        </h1>
        <p class="text-slate-500 text-sm">Procesamiento de linderos catastrales mediante Excel</p>
      </div>
      <div id="statusBadge"
        class="hidden px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold animate-pulse">
        ARCHIVO LISTO
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <div class="lg:col-span-4 space-y-6">

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4">1. Carga de Datos</h2>

          <label
            class="group flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition-all">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <i class="fas fa-file-excel text-3xl text-slate-300 group-hover:text-blue-500 mb-3"></i>
              <p class="text-sm text-slate-500 group-hover:text-blue-600 font-medium text-center px-4">Arrastre o
                seleccione el Excel</p>
            </div>
            <input type="file" id="fileInput" accept=".xlsx, .xls" class="hidden" />
          </label>
          <p id="fileName" class="mt-3 text-xs text-blue-600 font-bold truncate px-2 text-center"></p>

          <div class="mt-6">
            <div class="flex justify-between mb-1">
              <span class="text-[10px] font-bold text-slate-400 uppercase">Progreso</span>
              <span id="texto" class="text-[10px] font-bold text-blue-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5">
              <div id="progressBar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300"
                style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div id="panelAcciones" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden">
          <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4">2. Validar y Generar</h2>
          <div id="botonRedaccionContainer" class="space-y-3">
          </div>
          <button onclick="location.reload()" class="w-full mt-4 text-xs text-red-500 font-semibold hover:underline">
            <i class="fas fa-trash-alt mr-1"></i> Descartar y volver a empezar
          </button>
        </div>

      </div>

      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Documento de
              Previsualización</span>
            <div class="flex space-x-2">
              <div class="w-3 h-3 rounded-full bg-red-300"></div>
              <div class="w-3 h-3 rounded-full bg-yellow-300"></div>
              <div class="w-3 h-3 rounded-full bg-green-300"></div>
            </div>
          </div>

          <div class="p-8 max-h-[70vh] overflow-y-auto bg-white">
            <div id="info" class="mb-8 text-slate-600"></div>
            <hr class="my-6 border-slate-100" />
            <div id="redaccionTecnica" class="preview-content text-slate-800 text-justify whitespace-pre-wrap"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="main/app.js"></script>
</body>

</html>
